<!doctype html><meta charset="utf-8"><title>Reversi engineering measurements</title>
<p>Developer-only measurement harness. Ordinary play uses the application workers.</p>
<script type="module">
let next=0;const pending=new Map();
const worker=new Worker('./wasm_benchmark_worker.js',{type:'module'});
worker.onmessage=({data})=>{const p=pending.get(data.id);if(!p)return;pending.delete(data.id);data.error?p.reject(Error(data.error)):p.resolve(data.result);};
window.measure=(op,args={})=>new Promise((resolve,reject)=>{const id=++next;pending.set(id,{resolve,reject});worker.postMessage({id,op,...args});});
</script>
