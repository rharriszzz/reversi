<!doctype html><meta charset="utf-8"><title>Reversi Safari qualification</title>
<p>Test-only worker boundary. Uses the committed production Wasm engine.</p>
<script type="module">
let worker,next=0;const pending=new Map();
window.safariRequest=(op,args={})=>new Promise((resolve,reject)=>{const id=++next;pending.set(id,{resolve,reject});worker.postMessage({id,op,...args});});
window.safariReset=()=>{
 for(const p of pending.values())p.reject(Error('Worker reset'));pending.clear();worker?.terminate();
 worker=new Worker('./safari_qualification_worker.js',{type:'module'});
 worker.onmessage=({data})=>{const p=pending.get(data.id);if(!p)return;pending.delete(data.id);data.error?p.reject(Error(data.error)):p.resolve(data.result);};
 return safariRequest('init');
};
</script>
